name: Verify Auth
on:
  push:
  pull_request:
jobs:
  verify:
    # Three parallel shards keep a push's Verify well inside 15 minutes;
    # together they run everything `rer verify` runs.
    name: verify (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [app, protocol, browser]
    permissions:
      contents: read
    env:
      CI: 'true'
      RER_SERVER_JOURNEY: '1'
      WRANGLER_SEND_METRICS: 'false'
      X_LOCAL_EXPLORER: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Free space from unused hosted runner SDKs
        shell: bash
        run: |
          echo 'Checkout and temporary disk space before SDK removal (bytes):'
          df -B1 "$GITHUB_WORKSPACE" "${TMPDIR:-/tmp}"
          # Auth uses Node, pnpm, Chromium and workerd, not Android, .NET or Haskell.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          echo 'Checkout and temporary disk space after SDK removal (bytes):'
          df -B1 "$GITHUB_WORKSPACE" "${TMPDIR:-/tmp}"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.shard == 'browser'
        run: pnpm exec playwright install --with-deps chromium
      - if: matrix.shard == 'app'
        run: pnpm exec rer check --profile first-party
      - run: pnpm run build
      - if: matrix.shard == 'app'
        run: pnpm run typecheck && pnpm run test:typecheck && pnpm run test:runtime && pnpm run test:email-link && pnpm run test:site
      - if: matrix.shard == 'protocol'
        run: pnpm run test:auth
      - if: matrix.shard == 'browser'
        run: pnpm run test:browser
