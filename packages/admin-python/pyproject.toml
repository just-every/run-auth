[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runeditrun-auth"
version = "0.1.0"
description = "Server-only scoped Auth administration client"
requires-python = ">=3.10"
dependencies = ["PyJWT[crypto]==2.10.1"]
license = "MIT"

[tool.setuptools.packages.find]
include = ["runeditrun_auth*"]

[tool.setuptools.package-data]
runeditrun_auth = ["quickstart.py"]
