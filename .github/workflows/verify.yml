name: Verify Auth
on:
  push:
  pull_request:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          wf="${WF_REF%@*}"; wf="${wf##*/}"
          # Evidence is only a push run of this workflow from this repository, never this run: a pull request
          # tests its merge ref, a dispatch may run a subset, and a PR run of this workflow may itself be a skip.
          # Prints "<status> <conclusion>" of the newest such run on SHA $1, or nothing (any API error: nothing).
          newest_push() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$1&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and .id != $GITHUB_RUN_ID)] | max_by(.id) | select(. != null) | \"\(.status) \(.conclusion)\"" || true
          }
          green() { [ "$(newest_push "$1")" = "completed success" ]; }
          skip=false
          # C1: main push of a SHA whose newest push run of this workflow (a branch run) is green.
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && green "$GITHUB_SHA"; then skip=true; fi
          # C3 (exact): same tree as the parent, and the parent's newest push run is green (e.g. an empty commit).
          if [ "$skip" = false ] && [ "$EVENT" = push ] && parent=$(git rev-parse -q --verify HEAD~1) \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD~1^{tree}')" ] && green "$parent"; then skip=true; fi
          # C2: same-repository PR. The lander takes any green same-repo run on the exact SHA as evidence,
          # pull_request runs included, so this run may pass without shards only when the push run on the
          # PR head is green: wait for it (at most 25 minutes).
          # No push run, any other result, or the wait running out: run in full.
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            for _ in $(seq 1 50); do
              state=$(newest_push "$PR_HEAD")
              case "$state" in
                'completed success') skip=true; break ;;
                ''|completed\ *) break ;;
                *) sleep 30 ;;
              esac
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  shards:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    # Native checks and the browser job together run every rer verify check.
    # The browser image already contains the pinned browser and OS dependencies.
    name: verify (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [app, protocol, workforce]
    permissions:
      contents: read
    env:
      CI: 'true'
      RER_SERVER_JOURNEY: '1'
      WRANGLER_SEND_METRICS: 'false'
      X_LOCAL_EXPLORER: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Free space from unused hosted runner SDKs
        if: matrix.shard == 'app'
        shell: bash
        run: |
          echo 'Checkout and temporary disk space before SDK removal (bytes):'
          df -B1 "$GITHUB_WORKSPACE" "${TMPDIR:-/tmp}"
          # Auth uses Node, pnpm, Chromium and workerd, not Android, .NET or Haskell.
          for sdk in /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup; do
            available=$(df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1)
            if [ "$available" -ge $((20 * 1024 * 1024 * 1024)) ]; then break; fi
            sudo rm -rf -- "$sdk"
          done
          echo 'Checkout and temporary disk space after SDK removal (bytes):'
          df -B1 "$GITHUB_WORKSPACE" "${TMPDIR:-/tmp}"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        if: matrix.shard == 'workforce'
        with:
          go-version: '1.25.1'
          cache-dependency-path: packages/terraform-provider/go.sum
      - name: Install provider journey CLIs
        if: matrix.shard == 'workforce'
        run: |
          python3 scripts/install-terraform-tools.py "$RUNNER_TEMP/auth-iac"
          echo "$RUNNER_TEMP/auth-iac" >> "$GITHUB_PATH"
      - name: Check provider and actual Terraform and OpenTofu journeys
        if: matrix.shard == 'workforce'
        run: |
          go -C packages/terraform-provider test ./...
          pnpm run test:terraform
      - if: matrix.shard == 'app'
        run: pnpm exec rer check --profile first-party
      - if: matrix.shard != 'protocol'
        run: pnpm run build
      - if: matrix.shard == 'app'
        run: pnpm run typecheck && pnpm run test:runtime && pnpm run test:email-link && pnpm run test:site && pnpm run test:auth:app
      - if: matrix.shard == 'protocol'
        run: pnpm run test:auth:protocol
      - if: matrix.shard == 'workforce'
        run: pnpm run test:auth:workforce
  browser:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    name: verify (browser-${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        suite: [ui, workforce, offline, docs]
    permissions:
      contents: read
    env:
      CI: 'true'
      RER_SERVER_JOURNEY: '1'
      WRANGLER_SEND_METRICS: 'false'
      X_LOCAL_EXPLORER: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        if: matrix.suite == 'ui'
        with:
          go-version: '1.25.1'
          cache-dependency-path: packages/terraform-provider/go.sum
      - name: Install Terraform for UI drift journey
        if: matrix.suite == 'ui'
        run: |
          python3 scripts/install-terraform-tools.py "$RUNNER_TEMP/auth-iac"
          echo "$RUNNER_TEMP/auth-iac" >> "$GITHUB_PATH"
      - run: pnpm run build
      - run: pnpm run test:browser:${{ matrix.suite }}
  cli:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    name: verify (cli)
    # The pinned Playwright installer supports this Ubuntu release.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: 'true'
      RER_SERVER_JOURNEY: '1'
      WRANGLER_SEND_METRICS: 'false'
      X_LOCAL_EXPLORER: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm run build
      - run: timeout 240s pnpm run test:browser:cli
  verify:
    needs: [plan, shards, browser, cli]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the plan and every shard
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          for result in $RESULTS; do test "$result" = success; done
