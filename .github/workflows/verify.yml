name: Verify Auth
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI: 'true'
      RER_SERVER_JOURNEY: '1'
      WRANGLER_SEND_METRICS: 'false'
      X_LOCAL_EXPLORER: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Free space from unused hosted runner SDKs
        shell: bash
        run: |
          echo 'Checkout and temporary disk space before SDK removal (bytes):'
          df -B1 "$GITHUB_WORKSPACE" "${TMPDIR:-/tmp}"
          # Auth uses Node, pnpm, Chromium and workerd, not Android, .NET or Haskell.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          echo 'Checkout and temporary disk space after SDK removal (bytes):'
          df -B1 "$GITHUB_WORKSPACE" "${TMPDIR:-/tmp}"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/rer.mjs check --profile first-party
      - run: node scripts/rer.mjs verify
